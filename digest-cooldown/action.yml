name: Digest cooldown
description: >-
  Gate external container-image digest bumps behind a cooldown period via a
  commit status, working around Renovate's lack of digest releaseTimestamp.
inputs:
  cooldown-days:
    description: Days an external image digest must age before the status passes
    default: "3"
  skip-registries:
    description: Comma-separated registry/name prefixes treated as trusted (not gated)
    default: registry.infra.tgy.io,ghcr.io/tsuguya
  github-token:
    description: Token used for gh API calls
    default: ${{ github.token }}
runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ github.repository }}
        COOLDOWN_DAYS: ${{ inputs.cooldown-days }}
        SKIP_REGISTRIES: ${{ inputs.skip-registries }}
      run: python3 "$GITHUB_ACTION_PATH/digest-cooldown.py"
